    .error {

      width: 100%;

    #snackbar {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 2px;
      padding: 10px;
      position: fixed;
      z-index: 1;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      transition: visibility 0s, transform 0.5s ease-out;
    }

    #snackbar.show {
      visibility: visible;
      transform: translateX(-50%) translateY(-50%);
    }

  <script>
    function checkScreenSize() {
      //console("Screen width:", window.innerWidth); // Log the screen width
      if (window.innerWidth > 768) {
        const messageElement = document.createElement('access-denied');
        document.body.innerHTML = ''; // Clear the body content
        document.body.appendChild(messageElement); // Append the web component
      }
    }
    window.onload = checkScreenSize;
    window.onresize = checkScreenSize;
  </script>
  <script>
    $(document).ready(function () {



      var storedMobileNumber = localStorage.getItem('mobile_number');
      var role = localStorage.getItem('role');
      var user_id = localStorage.getItem('user_id');
      if (storedMobileNumber) {
        $('#mobile_number').val(storedMobileNumber);
      }
      $('#myForm').validate({
        rules: {
          name: {
            required: true,
            minlength: 3,
          },
          email: {
            // required: true,
            email: true,
          },
          mobile_number: {
            required: true,
            minlength: 10,
            maxlength: 10,
            digits: true,
          }
          // aadhar_number: {
          //   required: true,
          //   minlength: 12,
          //   maxlength: 12,
          //   digits: true,
          // }
        },
        messages: {
          name: {
            required: "Please enter a username",
            minlength: "Username must be at least 3 characters long",
          },
          email: {
            // required: "Please enter an email address",
            email: "Please enter a valid email address",
          },
          mobile_number: {
            required: "Please enter a mobile number",
            minlength: "Mobile number must be exactly 10 digits",
            maxlength: "Mobile number must be exactly 10 digits",
            digits: "Please enter only digits",
          },


        },

        errorPlacement: function (error, element) {
          if (element.attr("name") == "name" ||
            element.attr("name") == "email" ||
            element.attr("name") == "mobile_number")
          // element.attr("name") == "aadhar_number")
          {
            // Find the closest input-group div and insert the error message after it
            error.insertAfter(element.closest('.input-group'));
          } else {
            // Display the error message in the snackbar for any other errors
            $('#snackbar').text(error.text());
            $('#snackbar').addClass('error');
            $('#snackbar').addClass('show');
            setTimeout(function () {
              $('#snackbar').removeClass('show');
            }, 3000);
          }
        },
        submitHandler: function (form) {
          const formData = $(form).serializeArray(); // Get form data as an array
          formData.push({ name: 'user_id', value: user_id }); // Add user_id to the data
          // Show success message in the snackbar

          $.ajax({
            url: config.tamil_nilam_url + '/v1/profile',
            // url: config.send_verify_otp + '/v1/tamil_nilam_registration',
            // url: 'https://tngis.tnega.org/generic_api/v1/tamil_nilam_registration', // Replace with your backend PHP script path
            headers: {
              'X-APP-NAME': 'T@mi!_nill@m^&', // replace with your app name
              'X-APP-USER-ID': user_id,
            },
            type: 'POST',
            data: $.param(formData), // Serialize the array including user_id
            success: function (response) {
              //console(response);
              // var data = JSON.parse(response);
              if (response && response.length > 0 && response[0].success === 1) {
                const userData = response[0].data; // Access the `data` object
                const username = userData.name; // Access the name

                // Store the name in localStorage or use it as needed
                // localStorage.setItem('name', username);
                localStorage.setItem('username', username);
                $('#snackbar').text("User Registered Successfully");
                $('#snackbar').removeClass('error');
                $('#snackbar').addClass('success');
                $('#snackbar').addClass('show');
                setTimeout(function () {


                  $('#snackbar').removeClass('show');
                  // Redirect to another page or perform further actions
                  //   if (role == 'VAO') {
                  //     window.location.href = "officialmap.html";
                  // } else {
                  localStorage.setItem('valid_user', "true");
                  window.location.href = "map.html";
                  // }
                }, 3000);
              } else {
                $('#snackbar').text(response[0].message);
                $('#snackbar').addClass('error');
                $('#snackbar').addClass('show');
                setTimeout(function () {
                  $('#snackbar').removeClass('show');
                }, 3000);
              }
            },
            error: function () {
              $('#snackbar').text("Error: Unable to register user");
              $('#snackbar').addClass('error');
              $('#snackbar').addClass('show');
              setTimeout(function () {
                $('#snackbar').removeClass('show');
              }, 3000);
            }
          });

        }
      });
      const termsCheckbox = document.getElementById('termsCheckbox');
      const submitBtn = document.getElementById('submitBtn');

      // Add an event listener to enable/disable the submit button based on the checkbox
      termsCheckbox.addEventListener('change', function () {
        submitBtn.disabled = !this.checked;
      });
    });
  </script>
