    function isMobileDevice() {
      return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function checkScreenSize() {
      console.log("Screen width:", window.innerWidth, "Orientation:", screen.orientation?.type);

      const existingMessage = document.querySelector('access-denied');
      const isWideScreen = window.innerWidth > 768;
      const isMobile = isMobileDevice(); // Check if it's a mobile device

      if (isWideScreen && !isMobile) {
        // Show access-denied only for large screens (not mobile)
        if (!existingMessage) {
          const messageElement = document.createElement('access-denied');
          document.body.innerHTML = ''; // Clear body content
          document.body.appendChild(messageElement);
        }
      } else {
        // Remove access-denied for mobile screens and landscape mode
        if (existingMessage) {
          existingMessage.remove();
          location.reload(); // Reload to restore original content
        }
      }
    }

    // Run on load and resize/orientation change
    window.onload = checkScreenSize;
    window.onresize = checkScreenSize;
    window.addEventListener("orientationchange", checkScreenSize);

  </script>

  <script type="text/javascript">
    var valid_user = localStorage.getItem('valid_user');



    $(document).ready(function () {
      // // Check if mobile number is already stored and redirect accordingly
      if (valid_user === "true") {
        window.location.href = "map.html";
      }

      $('#myForm').validate({
        rules: {
          mobile_number: {
            required: true,
            minlength: 10,
            maxlength: 10,
            digits: true
          }
        },
        messages: {
          mobile_number: {
            required: "Mobile number is required",
            minlength: "Mobile number must be exactly 10 digits",
            maxlength: "Mobile number must be exactly 10 digits",
            digits: "Please enter only digits"
          }
        },
        errorPlacement: function (error, element) {
          $('#snackbar').text(error.text()).addClass('error show');
          setTimeout(function () {
            $('#snackbar').removeClass('show');
          }, 3000);
        },
        unhighlight: function (element) {
          $(element).removeClass('error-input');
        },
        submitHandler: function (form) {
          var mobile_number = $("#mobile_number").val();
          $.ajax({
            type: 'POST',
            // url: config.send_verify_otp + '/v1/tamil_nilam_otp',
            url: config.tamil_nilam_url + '/v1/otp',
            headers: {
              'X-APP-KEY': config.otp_app_key,
              'X-APP-NAME': config.otp_app_name,
              'X-APP-USER-ID': 'NULL',
            },
            data: {
              otp_type: 'sms',
              request_type: 'send',
              mobile_number: mobile_number,
              app_name: 'oTp$%^&!@'
            },
            success: function (response) {
              if (response && response.length > 0 && response[0].success === 1) {
                $('#snackbar').text("OTP sent successfully")
                  .removeClass('error')
                  .addClass('success show');
                localStorage.setItem('mobile_number', mobile_number);
                $('#login_button').prop('disabled', true).addClass('disabled-button');
                setTimeout(function () {
                  $('#snackbar').removeClass('show');
                  // var redirectUrl = localStorage.getItem('redirect_url') || "otp.html";
                  window.location.href = "otp.html";
                }, 1000);
              } else {
                $('#snackbar').text(response[0].message)
                  .removeClass('success')
                  .addClass('error show');
                localStorage.setItem('mobile_number', mobile_number);
                setTimeout(function () {
                  // Optional: You can uncomment these lines if you want to redirect to another page
                  // window.location.href = "sign-up.html";
                }, 1000);
              }
            },
            error: function (xhr, status, error) {
              Swal.fire({
                icon: 'error',
                title: error,
                showConfirmButton: true,
                timer: 3000
              });
            }
          });
          return false; // Prevent the default form submission
        }
      });

      // // Handle Official Login Button
      // $('#official_login_button').on('click', function() {
      //     localStorage.setItem('redirect_url', 'otp.html');
      //     $('#myForm').submit(); // Trigger the form submission
      // });

      // Handle Regular Login Button
      $('#login_button', '#official_login_button').on('click', function () {
        localStorage.setItem('redirect_url', 'otp.html');
        // $('#myForm').submit(); // Trigger the form submission
      });
    });

  </script>
