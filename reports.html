      <main id="main" class="main">
         <!-- End Page Title -->
         <section class="section dashboard">
            
            <div class="row">
               
             <div class="col-lg-12">
                  <div class="card">
                     <div class="card-body"> 
                        <h5 class="card-title"><i class="bi bi-check2-circle"></i> Generate Reports</h5>
                        <div class="row">
                           <div class="col-lg-3 mb-2">
                             <input type="text" class="form-control" placeholder="Enter Survey No"> 
                           </div>
                           <div class="col-lg-3 mb-2">
                             <input type="text" class="form-control" placeholder="Enter Patta No"> 
                           </div>
                           <div class="col-lg-3 mb-2"> 
                              <select class="form-select" aria-label="District Name">
                                 <option selected="">Select District</option>
                                 <option value="1">District One</option>
                                 <option value="2">District Two</option>
                                 <option value="3">District Three</option>
                              </select>
                           </div>
                           <div class="col-lg-3 mb-2">
                              <select class="form-select" aria-label="Taluk Name">
                                 <option selected="">Select Taluk</option>
                                 <option value="1">Taluk One</option>
                                 <option value="2">Taluk Two</option>
                                 <option value="3">Taluk Three</option>
                              </select>
                           </div>
                           <div class="col-lg-3 mb-2">
                              <select class="form-select" aria-label="Village Name">
                                 <option selected="">Select Village</option>
                                 <option value="1">Village One</option>
                                 <option value="2">Village Two</option>
                                 <option value="3">Village Three</option>
                              </select>
                           </div>
                           <div class="col-lg-4 v-center mb-2">  
                              <a href="#" class="btn btn-danger custom-btn"><i class="bi bi-trash3"></i> Clear</a>
                              <a href="#" class="btn btn-success custom-btn mx-2 view-file"><i class="bi bi-file-earmark-text"></i> Show Report</a>
                           </div>
                        </div>
                        </div>
                     </div>
                  </div>
               
               
            </div>
           
            </div>
