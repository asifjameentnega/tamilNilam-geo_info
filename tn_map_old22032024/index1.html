      <script type="text/javascript">
         var application_path;

      if (window.localStorage.getItem("user_details_kmut_verification") === null) {

         // Redirect to OTP Page once Registration is successfull
         function otpPage() {
            var x = document.getElementById("snackbar");
            x.className = "show";
            $("#snackbar_message").empty();
            $("#snackbar_message").append(`User Found`);
            setTimeout(function () { x.className = x.className.replace("show", ""); }, 1000);
            var delay = 1700;
            setTimeout(function () { window.location = "otp.html"; }, delay);
         }
         // Handle Error in Ajax call
         function errorDisplay(val) {
            var x = document.getElementById("error_snackbar");
            x.className = "show";
            $("#error_snackbar_message").empty();
            $("#error_snackbar_message").append(val);
            setTimeout(function () { x.className = x.className.replace("show", ""); }, 3000);
         }
         // Register Function
         function registerUser() {
            //var name = $("#name").val();
            var mobile_number = $("#mobile_number").val();
            //var email = $("#email").val();
            if (mobile_number != '') {
               $.ajax({
                  type: 'POST',
                  headers: { 'X-APP-KEY': config.app_key,'X-APP-NAME': 'KMUT Verification App' },
                  url: `${config.api_url}/login_user`,
                  data: {
                     //'name': name,
                     'mobile_number': mobile_number,
                     //'email': email,
                     //'application_name':application_name
                  },
                  dataType: 'json',
                  success: function (data, textStatus, http) {
                     //console.log(data[0]);
                     if (http.status == 200) {
                        if (data[0].success == 1) {
                           window.localStorage.setItem('user_id', JSON.stringify(data[0].data.user_id.id));
                           window.localStorage.setItem('mobile_number', mobile_number);
                           //window.localStorage.setItem('application_name', application_name);
                           window.localStorage.setItem('session_id', data[0].data.session_id);
                           otpPage();
                        }
                     } else if (http.status == 409) {
                        errorDisplay(data[0].message);
                     } else if (http.status == 400) {
                        errorDisplay(data[0].message);
                     } else {
                        errorDisplay(data[0].message);
                     }
                  },
                  error: function (errorThrown) {
                     //console.log(errorThrown);
                     /*message = errorThrown.responseText;
                     errorDisplay(message);*/
                     message = errorThrown.responseJSON[0].message;
                     errorDisplay(message);
                  }
               })
            } else {
               alert("Please fill all the fields")
            }
         }
         $(document).on({
        ajaxStart: function() {
          $('#preloader').show();
        },
        ajaxStop: function() {
          $('#preloader').hide();
        }
      });
      </script>
